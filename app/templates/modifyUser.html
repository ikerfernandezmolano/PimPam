<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Datos - PimPam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='signin-reg.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
</head>
<body class="background">
    <a href="/">
      <img src="{{ url_for('static', filename='return.png') }}" class="flecha">
    </a>
    <div class="Cuerpo"> 
      <h1>MODIFICAR DATOS</h1>
      {% for category, mensaje in mensajes %}
          <label class="message {{ category }}">{{ mensaje }}</label>
      {% endfor %}
      <form action="/modify_user" method="POST">
          <div class="Cuerpo">
              <input type="email" id="email" name="email" placeholder="CORREO ELECTRÓNICO" value="{{ usuario_sesion.Email }}" required>
              <input type="password" id="password" name="password" placeholder="CONTRASEÑA ACTUAL" required>
              <input type="password" id="confirm_password" name="confirm_password" placeholder="NUEVA CONTRASEÑA" required>
              <input type="pokefav" id="pokefav" name="pokefav" placeholder="ELEGIR POKEMON FAVORITO" value="{{ usuario_sesion.IDFavorito }}" required>
          </div>
          <div class="Botones">
              <button type="submit" class="btn">CONFIRMAR</button>
          </div>
      </form>
  </div>
</body>
</html>
